<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1724"/>
      <stop offset="100%" stop-color="#070B12"/>
    </linearGradient>
    
    <!-- Premium Gold Metal Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCE09B"/>
      <stop offset="30%" stop-color="#DFB260"/>
      <stop offset="70%" stop-color="#BC8F36"/>
      <stop offset="100%" stop-color="#E7C678"/>
    </linearGradient>

    <!-- Glowing Aura Filter -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Dark Navy Round Box -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)"/>
  
  <!-- Subtle Outer Rim Border -->
  <rect x="12" y="12" width="488" height="488" rx="98" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-opacity="0.25"/>

  <!-- Main Legal Scales + AI Geometry Icon Group -->
  <g transform="translate(256, 256)" filter="url(#goldGlow)">
    
    <!-- Central Pillar / Stem -->
    <path d="M-6 -100 L6 -100 L6 110 L25 110 L25 130 L-25 130 L-25 110 L-6 110 Z" fill="url(#goldGrad)"/>
    
    <!-- Top Crown Finial -->
    <circle cx="0" cy="-115" r="16" fill="url(#goldGrad)"/>
    
    <!-- Balance Scale Crossbar (Slight curved arc for elegance) -->
    <path d="M-130 -60 Q0 -75 130 -60 Q130 -50 120 -50 Q0 -65 -120 -50 Q-130 -50 -130 -60 Z" fill="url(#goldGrad)"/>

    <!-- Left Scale Strings & Dish -->
    <g transform="translate(-115, -50)">
      <line x1="-30" y1="0" x2="-45" y2="75" stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round"/>
      <line x1="30" y1="0" x2="45" y2="75" stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round"/>
      <!-- Bowl Dish -->
      <path d="M-55 75 Q0 115 55 75 Z" fill="url(#goldGrad)"/>
    </g>

    <!-- Right Scale Strings & Dish -->
    <g transform="translate(115, -50)">
      <line x1="-30" y1="0" x2="-45" y2="75" stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round"/>
      <line x1="30" y1="0" x2="45" y2="75" stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round"/>
      <!-- Bowl Dish -->
      <path d="M-55 75 Q0 115 55 75 Z" fill="url(#goldGrad)"/>
    </g>

    <!-- AI Sparkle / Four-pointed Intelligence Star at Top Center -->
    <path d="M0 -170 Q0 -145 25 -145 Q0 -145 0 -120 Q0 -145 -25 -145 Q0 -145 0 -170 Z" fill="url(#goldGrad)"/>

    <!-- Subtle AI Micro Sparkles -->
    <path d="M120 -130 Q120 -115 135 -115 Q120 -115 120 -100 Q120 -115 105 -115 Q120 -115 120 -130 Z" fill="#FCE09B" opacity="0.85"/>
    <path d="M-135 110 Q-135 95 -120 95 Q-135 95 -135 80 Q-135 95 -150 95 Q-135 95 -135 110 Z" fill="#FCE09B" opacity="0.85"/>
  </g>
</svg>
